name: Build APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # The android directory is regenerated by prebuild every run, so there is
      # nothing stable in it to key on: the lockfile stands in for the
      # dependency set the build compiles against.
      - name: cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      # One ABI: arm64-v8a is every phone this is installed on. x86 and
      # x86_64 are emulator images, and armeabi-v7a is 32-bit hardware -- each
      # one is a full native build and a full APK for nobody. Add them back to
      # this flag if that ever changes.
      - name: build apk
        run: ./gradlew assembleFullRelease -PreactNativeArchitectures=arm64-v8a --build-cache --parallel
        working-directory: android

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: set build tool version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo build tool version: $BUILD_TOOL_VERSION
          echo "VERSION_CODE=$(jq -r '.versionCode' package.json)" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@v1
        name: sign apk
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: rename apk
        run: |
          sudo apt-get update && sudo apt-get install -y rename
          rename 's/release-unsigned-signed/release/' *.apk
        working-directory: android/app/build/outputs/apk/full/release

      # A dispatched build has no tag to release to: keep the apk as an
      # artifact instead, so a test build can be installed without publishing
      # a release for it.
      - uses: actions/upload-artifact@v4
        name: keep apk
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: apk
          path: android/app/build/outputs/apk/full/release/*-release.apk

      - uses: softprops/action-gh-release@v2
        name: upload apk
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: metadata/en-US/changelogs/${{ env.VERSION_CODE }}04.txt
          files: android/app/build/outputs/apk/full/release/*-release.apk
